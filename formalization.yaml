status:
  scope: >-
    The selected Comparator declaration is PalomarEuler.main_result, proved
    in Solution.lean by Euler2D.finiteLp_nonuniqueness in
    RequestProject/Euler/FiniteLpNonuniqueness.lean. Its only mathematical
    inputs are a real T with 0 < T and a real finite p with 1 <= p.
    The initial datum and solutions may depend on T and p; no assertion is
    made for every prescribed initial datum or for one datum simultaneously
    satisfying every exponent. On the periodic square [0,2*pi)^2, both
    solutions satisfy the distributional unforced Euler identity, have the
    same initial datum, and have positive squared space-time L2 distance.
    Actual spatial Lp-valued vorticity curves are strongly measurable,
    belong to Bochner L-infinity on [0,T], and satisfy the distributional curl
    identity at every time in [0,T]. The p=1 endpoint is obtained by lowering
    exponents from q=max(p,2). This scope addresses only the first
    two-dimensional finite-Lp question in Problem 6. Energy conservation,
    W1-infinity-in-time regularity, the alpha_O/alpha_U threshold question,
    and three-dimensional variants are not advertised as formalized.
    Challenge.lean has one deliberate theorem-proof sorry. The substantive
    source has no proof holes. The full pinned rc4 build, clean project
    rebuild, complete statement and axiom audits, and official sandboxed
    Comparator have passed. Lean, NanoDa, and con-ron accept the selected
    theorem and its exported dependencies. Palomar registered version 1 on
    2026-10-28 at commit ad7deb36ea565f34bdb784e9153073c5a220d46a;
    see the registry block for the immutable record and verification links.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  # Project-specific state, accepted as an additional v0.4 field.
  # Set to complete only after the exact release snapshot passes all checks.
  verification: "complete"

