version: "v0.4"

project:
  name: "Finite-Lp vorticity nonuniqueness for two-dimensional Euler"
  description: >-
    A Lean 4 formalization of nonuniqueness for the unforced incompressible
    Euler equations on the two-dimensional square torus. For each finite real
    exponent p at least one and each positive time interval, the target theorem
    constructs a common mean-zero, divergence-free initial datum in L2 and
    W1p, and two distinct weak solutions continuous in time with values in L2.
    Their distributional vorticities have strongly measurable Lp-valued
    representatives that are essentially bounded in time. This is the
    two-dimensional finite-Lp question in the first part of Buckmaster and
    Vicol's Problem 6. Release verification remains pending.
  authors:
    - "Tao Tao"
    - "Haiqi Zhang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tao Tao"
    - "Haiqi Zhang"

classification:
  arxiv: ["math.AP"]
  msc2020: ["35Q31", "76B03"]

