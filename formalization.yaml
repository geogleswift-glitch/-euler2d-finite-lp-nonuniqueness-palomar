    authors:
      - "Tao Tao"
      - "Haiqi Zhang"
    type: "original-proof"
    location: "Original author manuscript, main theorem; revised exposition at paper/main.tex"
    relationship: "other"
    note: >-
      This entry declares the authors' original result, first publicly
      presented by this formalization. The underlying informal
      argument was developed by the human authors with ChatGPT assistance
      before its Lean formalization. The original source snapshot used for
      comparison is pinned in docs/ERRATA-AND-DEVIATIONS.md. With the authors'
      permission, a revised TeX exposition is now provided at paper/main.tex;
      it was added after Palomar version 1 and is not asserted to be byte-identical
      to that original source snapshot. This provenance declaration does not
      certify novelty or priority against all literature.
  - title: "Convex integration and phenomenologies in turbulence"
    authors:
      - "Tristan Buckmaster"
      - "Vlad Vicol"
    type: "paper"
    id: "https://doi.org/10.4171/EMSS/34"
    location: >-
      EMS Surveys in Mathematical Sciences 6 (2019), no. 1/2, 173-263,
      Problem 6; arXiv:1901.09023v2, printed pages 66-67.
    relationship: "background"
    note: >-
      The first, two-dimensional finite-Lp nonuniqueness question supplies
      the problem context. This survey is not the source of the new proof.
      The volume year is 2019; the publisher records publication on
      5 March 2020. Publisher:
      https://ems.press/journals/emss/articles/16808 .
      Public author preprint: https://arxiv.org/abs/1901.09023v2 .
  - title: "Flexibility of Two-Dimensional Euler Flows with Integrable Vorticity"
    authors: ["Elia Bruè", "Maria Colombo", "Anuj Kumar"]
    type: "paper"
    id: "https://arxiv.org/abs/2408.07934"
    relationship: "background"
    note: >-
      Establishes unforced nonuniqueness for some spatial exponent greater
      than one. It is cited for context, not imported as a formal proof.
  - title: "Non-uniqueness of Admissible Solutions for the 2D Euler Equation with Lp Vortex Data"
    authors: ["Francisco Mengual"]
    type: "paper"
    id: "https://doi.org/10.1007/s00220-024-05065-9"
    relationship: "background"
    note: >-
      Concerns arbitrary finite-exponent initial vorticity. The positive-time
      solution conclusion does not preserve that vorticity class.
  - title: "Non-unique vanishing-viscosity solutions of 2D Euler with vorticity in Lp"
    type: "paper"
    id: "https://hexagonmath.org/2610.00314v1"
    relationship: "background"
    contributors:
      - name: "Umberto Pappalettera"
        role: "deposit contributor"
      - name: "Massimo Sorella"
        role: "deposit contributor"
    note: >-
      An October 2026 AI-generated manuscript deposit claiming arbitrary
      finite p greater than two and vanishing-viscosity nonuniqueness on the
      plane. The deposit explicitly disclaims human understanding of its
      mathematics. This claim is not checked or imported by this project;
      the selected formal theorem concerns weak solutions on the torus.

