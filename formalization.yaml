fidelity:
  divergences: >-
    The source-facing Euler and Sobolev notions are the literal definitions
    used by the substantive development. The compared statement is intended
    to add the p=1 endpoint by finite-measure exponent lowering and to supply
    actual Bochner L-infinity-in-time Lp vorticity curves through proved
    measurability bridges. The initial datum is existential. No formalization
    of the manuscript's additional energy or W1-infinity-in-time corollary,
    nor of the separate alpha threshold question in the survey, is claimed.
    An unused auxiliary lemma about the L-infinity norm of arbitrary
    two-interface labels now explicitly assumes measurability of both
    label domains, as required by the pinned Mathlib norm definition.
    This does not add a hypothesis to any selected principal result.
    Two generic Sobolev norm estimates likewise now explicitly require
    strong measurability almost everywhere. All four internal C1 applications
    derive it from their existing continuity proofs. The higher-level C1
    Sobolev statements are unchanged, and the localized estimate retains
    arbitrary sets without a new set-measurability assumption.

