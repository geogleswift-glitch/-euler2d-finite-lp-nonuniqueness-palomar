name: Lean verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: "1"
      EULER_COMPILE_SLOTS: "2"
      EULER_FRESH_PROJECT: ${{ contains(github.event.head_commit.message || '', '[fresh-project]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Make disk space for Mathlib and kernel exports
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .
          free -h
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 20 * 1024**3, "At least 20 GiB of free disk is required before dependency retrieval"'
      - name: Validate the source and metadata
        run: |
          bash -n scripts/build-bounded.sh
          bash -n scripts/verify-comparator.sh
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
          python3 scripts/check_sources.py
          python3 scripts/validate_metadata.py
      - name: Install the pinned toolchain and authenticated Mathlib cache
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Restore project build artifacts
        if: env.EULER_FRESH_PROJECT != 'true'
        id: project-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake/build
          key: euler-lean-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ hashFiles('RequestProject/**/*.lean', 'Challenge.lean', 'Solution.lean', 'Verification/**/*.lean') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            euler-lean-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ hashFiles('RequestProject/**/*.lean', 'Challenge.lean', 'Solution.lean', 'Verification/**/*.lean') }}-
            euler-lean-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      - name: Build all sources with bounded compiler concurrency
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          if os.environ.get('EULER_FRESH_PROJECT') == 'true':
              artifacts = Path('.lake/build')
              assert not artifacts.exists() or not any(
                  path.is_file() for path in artifacts.rglob('*')
              ), 'Fresh verification requires an empty project build directory'
              print('Fresh project verification: no existing project build artifacts')
          PY
          timeout --signal=TERM --kill-after=30s 15000 bash scripts/build-bounded.sh
      - name: Preserve completed compilations for the next check
        if: always() && steps.project-cache.outputs.cache-primary-key != '' && steps.project-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake/build
          key: ${{ steps.project-cache.outputs.cache-primary-key }}
      - name: Enforce exact statements and axiom dependencies
        run: |
          git rev-parse HEAD
          lake env lean --version
          lake env lean Verification/Audit.lean
          lake --no-build build
      - name: Ensure verification did not modify tracked files
        run: git diff --exit-code
