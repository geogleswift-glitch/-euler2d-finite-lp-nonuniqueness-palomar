name = "RequestProject"
defaultTargets = ["RequestProject", "Challenge", "Solution", "Verification"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "1f414401f69059aa7eead47b53ee40bd38455eeb"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[lean_lib]]
name = "Verification"
roots = ["Verification.Audit"]
